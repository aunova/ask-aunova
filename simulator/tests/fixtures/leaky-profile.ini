; Stands in for the developer's real ~/.aws/config during one test.
;
; The test points AWS_CONFIG_FILE at this file — so the SDK's default profile
; resolution would find it — and then passes a DIFFERENT, empty set of
; profile files explicitly. The region below is deliberately not the one this
; project falls back to, so if the explicit set were ignored and the ambient
; configuration were read instead, the test would see this region and fail.
;
; Both section spellings are here because `default` and `profile default` are
; both legal, and a leak through either one should be caught.
[default]
region = eu-north-1

[profile leaky]
region = eu-north-1
