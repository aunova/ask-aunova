; An AWS profile file that defines no profiles.
;
; Tests pass this to both the config loader and the region provider so that
; neither of them parses the machine's real ~/.aws/config or
; ~/.aws/credentials. Naming a profile that does not exist is NOT enough for
; that: the shared files are still opened and read, and merely found to have
; no matching section.
;
; It is deliberately not empty of bytes, so that an accidental truncation to
; zero length is visible in a diff rather than silent.
